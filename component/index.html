<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#0b1426; --card:#101e36; --line:#22365a; --ink:#dbe4f3; --dim:#8fa3c7;
    --green:#2dd4a0; --red:#ff6b6b; --amber:#f5c542; --blue:#6ea8ff; --purple:#b07cf0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Segoe UI',system-ui,sans-serif}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;background:#0d1830;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
  input:focus,select:focus{outline:1px solid var(--blue)}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .top h1{font-size:17px;margin:0;color:#fff;white-space:nowrap}
  .chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--amber);color:var(--amber);white-space:nowrap}
  .chip.sim{border-color:var(--purple);color:var(--purple)}
  .busy{margin-left:auto;font-size:12px;color:var(--amber);visibility:hidden}
  .busy.on{visibility:visible}
  .wrap{display:flex;min-height:400px}
  nav.rail{width:220px;flex:0 0 220px;border-right:1px solid var(--line);padding:10px 8px}
  nav.rail button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--dim);padding:8px 10px;border-radius:6px;font-size:13.5px;margin-bottom:1px}
  nav.rail button:hover{background:#14224a;color:var(--ink)}
  nav.rail button.on{background:#14224a;color:#fff;border-left:3px solid var(--green);padding-left:7px}
  main{flex:1;padding:16px;min-width:0;max-width:1180px}
  select.mnav{display:none;margin-left:auto;width:auto}
  h2{font-size:19px;margin:2px 0 4px;color:#fff}
  .sub{color:var(--dim);font-size:13px;margin-bottom:12px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .card .lab{font-size:12px;color:var(--dim)}
  .card .val{font-size:20px;color:#fff;margin-top:2px;word-break:break-word}
  .banner{padding:9px 13px;border-radius:6px;margin:8px 0;font-size:13.5px}
  .warn{background:#3b2d08;border-left:4px solid var(--amber)}
  .crit{background:#3a1015;border-left:4px solid var(--red)}
  .sim{background:#2d1b3d;border-left:4px solid var(--purple);font-weight:600}
  .info{background:#12254a;border-left:4px solid var(--blue)}
  .okbox{background:#0e2e22;border-left:4px solid var(--green)}
  .ok{color:var(--green)}.bad{color:var(--red)}.amber{color:var(--amber)}.dim{color:var(--dim)}.small{font-size:12.5px}
  table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px;display:block;overflow-x:auto}
  table.t td,table.t th{border-bottom:1px solid #1d2d50;padding:5px 10px;text-align:left;vertical-align:top;white-space:pre-line}
  table.t th{color:var(--dim);font-weight:600}
  .btn{background:#1d2d50;color:var(--ink);border:1px solid #2d4470;border-radius:6px;padding:8px 14px}
  .btn:hover{background:#2d4470}
  .btn.primary{background:#0f5132;border-color:var(--green);color:#dffcef}
  .btn.primary:hover{background:#146c43}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:end}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
  details{margin:8px 0}summary{cursor:pointer;color:var(--blue);font-size:13.5px}
  pre{background:#0d1830;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font-size:12px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0 10px}
  .tabs button{background:none;border:none;color:var(--dim);padding:7px 11px;border-bottom:2px solid transparent;font-size:13.5px}
  .tabs button.on{color:#fff;border-bottom-color:var(--green)}
  canvas.chart{width:100%;background:#0a1424;border:1px solid var(--line);border-radius:8px}
  .tag{display:inline-block;background:#14224a;border:1px solid var(--line);border-radius:10px;padding:1px 9px;font-size:12px;color:var(--dim);margin:2px 4px 2px 0}
  .tag.hi{border-color:var(--green);color:var(--green)}
  .tag.risk{border-color:var(--red);color:var(--red)}
  .section{margin:18px 0 6px;font-size:15px;font-weight:600;color:#fff}
  .floorid{color:var(--dim);font-weight:400;font-size:12.5px;margin-left:6px}
  .modal{position:fixed;inset:0;background:rgba(4,8,18,.82);z-index:9;display:flex;align-items:flex-start;justify-content:center;padding:24px 10px}
  .modal>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;max-width:980px;width:100%;max-height:92%;overflow:auto;padding:14px}
  iframe.report{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px;background:#0b1426}
  @media (max-width:820px){
    nav.rail{display:none}
    select.mnav{display:block;flex:0 0 auto;max-width:44vw}
    .top{flex-wrap:wrap;row-gap:6px}
    .chip.sim{display:none}
    .busy{margin-left:0;flex-basis:100%}
    .g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}
    main{padding:12px}
  }
  @media (max-width:520px){ .g2,.g3,.g4,.g5{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="top">
  <h1>Multibagger Scout AI</h1>
  <span class="chip">RESEARCH ONLY</span>
  <span class="chip sim">NO REAL ORDERS</span>
  <select class="mnav" id="mnav"></select>
  <span class="busy" id="busy">Working…</span>
</div>
<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
</div>
<script src="./streamlit-component-lib.js"></script>
<script src="./app1.js"></script>
<script src="./app2.js"></script>
<script src="./app3.js"></script>
</body>
</html>
